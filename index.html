<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON PIGS SURVIVAL</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105@1.1/Seontack.woff');

        :root {
            --cold-blue: #00a2ff;
            --electric-cyan: #00ffd2;
            --pure-white: #ffffff;
            --danger-red: #ff2a2a;
            --purple-neon: #bd00ff;
            --green-neon: #39ff14;
            --deep-bg: #0b0f1a;
            --dark-panel: #141a26;
            --border-blue: #1e293b;
            --font-game: 'Seontack', sans-serif;
            --text-gray: #94a3b8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--deep-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 162, 255, 0.1) 0%, transparent 80%),
                linear-gradient(var(--border-blue) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-blue) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: #e2e8f0;
            font-family: var(--font-game);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 100;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* -------------------------------------------
           🚨 첫 화면 인트로 및 동영상 배경 영역 레이아웃 전면 수정
        ------------------------------------------- */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh;
            background-color: #000; /* 동영상 로드 전 기본 배경 */
            z-index: 9999; /* 무조건 모든 HUD와 게임 화면보다 위에 오도록 설정 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s, visibility 1s;
            overflow: hidden;
        }

        /* 동영상이 무조건 화면 전체를 채우고 글자 뒤에 깔리도록 고정 */
        .intro-video-bg {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            object-fit: cover; /* 비율 유지하며 화면 꽉 채움 */
            transform: translate(-50%, -50%);
            z-index: 1; /* 가장 아래 바닥 */
            opacity: 0.6; /* 글씨가 잘 보이도록 약간 어둡게 조절 */
            pointer-events: none;
        }

        /* 인트로 내부 텍스트 콘텐츠들이 영상 위로 올라오도록 강제 지정 */
        .intro-content {
            position: relative;
            z-index: 10; /* 비디오(z-index: 1)보다 위에 정렬 */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .intro-visual-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.1;
            z-index: 2;
            font-size: 8px;
            color: var(--cold-blue);
            font-family: monospace;
            overflow: hidden;
            white-space: pre;
            pointer-events: none;
        }

        .intro-title { 
            font-size: 48px; 
            color: var(--pure-white); 
            text-shadow: 0 0 25px rgba(0, 162, 255, 0.8), 0 0 5px #000;
            letter-spacing: 10px;
            margin-bottom: 10px;
        }

        .start-btn {
            padding: 18px 50px;
            border: 2px solid var(--cold-blue);
            color: var(--cold-blue);
            background: rgba(11, 15, 26, 0.85);
            cursor: pointer;
            letter-spacing: 6px;
            font-weight: bold;
            transition: 0.3s;
            font-family: var(--font-game);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.3);
            font-size: 14px;
        }

        .start-btn:hover {
            background: var(--cold-blue);
            color: #000;
            box-shadow: 0 0 25px var(--cold-blue);
        }

        /* 게임 메인 HUD 및 컨텐츠 레이아웃 */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            background: rgba(11, 15, 26, 0.95);
            border-bottom: 2px solid var(--cold-blue);
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.2);
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .game-title-main {
            font-size: 18px;
            font-weight: bold;
            color: var(--pure-white);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--cold-blue);
        }

        .stats-container {
            display: flex;
            gap: 25px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            width: 120px;
        }

        .stat-label { 
            font-size: 9px; 
            color: var(--cold-blue); 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .stat-bar-bg {
            height: 5px;
            background: #0f172a;
            border: 1px solid var(--border-blue);
            position: relative;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        #sync-fill { background-color: var(--pure-white); box-shadow: 0 0 10px var(--pure-white); }
        #integ-fill { background-color: var(--electric-cyan); box-shadow: 0 0 10px var(--electric-cyan); }
        #noise-fill { background-color: var(--danger-red); box-shadow: 0 0 10px var(--danger-red); }

        .location-info { 
            text-align: right; 
            color: var(--electric-cyan); 
            font-size: 11px; 
            border: 1px solid var(--cold-blue);
            padding: 4px 12px;
            background: rgba(0, 162, 255, 0.1);
            letter-spacing: 1.5px;
        }

        #game-screen {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 15px 25px;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 70px);
        }

        .visual-area {
            flex: 2.6;
            border: 1px solid var(--border-blue);
            background: #05070a;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            min-height: 380px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        /* 🚨 각 장면에 동영상을 배경으로 깔아주는 스타일 추가 */
        .scene-video-bg {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0.4; /* 자막 가독성을 위해 살짝 흐리게 처리 */
            pointer-events: none;
        }

        .key-visual-display {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            z-index: 10; /* 비디오 배경보다 위에 오도록 강제 */
        }

        .visual-title {
            font-size: 16px;
            color: var(--electric-cyan);
            margin-bottom: 12px;
            letter-spacing: 2.5px;
            text-shadow: 0 0 10px rgba(0, 255, 210, 0.6), 0 0 5px #000;
        }

        .visual-elements {
            font-size: 12px;
            color: var(--pure-white); /* 가독성을 위해 흰색 계열로 조정 */
            line-height: 1.7;
            max-width: 650px;
            white-space: pre-wrap;
            text-shadow: 0 0 8px #000, 0 0 3px #000; /* 비디오 위에서 잘 보이도록 그림자 추가 */
        }

        .scanline-effect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        .inventory-bar {
            position: absolute;
            bottom: 10px;
            left: 15px;
            font-size: 9px;
            color: var(--pure-white);
            background: rgba(20, 26, 38, 0.85);
            padding: 4px 10px;
            border: 1px solid var(--border-blue);
            letter-spacing: 1px;
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inventory-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #475569;
        }
        .inventory-dot.active {
            background: var(--electric-cyan);
            box-shadow: 0 0 8px var(--electric-cyan);
        }

        .dialog-container {
            flex: 0.9;
            display: flex;
            gap: 20px;
            min-height: 140px;
            max-height: 190px;
        }

        .portrait-box {
            width: 180px;
            background: var(--dark-panel);
            border: 1px solid var(--border-blue);
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--electric-cyan);
            font-size: 11px;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
        }

        .portrait-art {
            font-family: monospace;
            font-size: 8px;
            line-height: 1;
            color: var(--electric-cyan);
            text-shadow: 0 0 5px var(--electric-cyan);
            margin-bottom: 8px;
            white-space: pre;
        }

        .portrait-name {
            font-size: 10px;
            color: var(--pure-white);
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .dialog-box {
            flex-grow: 1;
            background: var(--dark-panel);
            border: 1px solid var(--border-blue);
            padding: 15px 20px;
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }

        .speaker-tag {
            background: var(--cold-blue);
            color: #000;
            padding: 3px 14px;
            font-weight: bold;
            font-size: 10px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            width: fit-content;
        }

        #dialog-text {
            line-height: 1.6;
            font-size: 13.5px;
            white-space: pre-wrap;
            color: #cbd5e1;
        }

        .choices-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding-bottom: 5px;
        }

        button.choice-btn {
            background: #1e293b;
            border: 1px solid var(--border-blue);
            color: #94a3b8;
            padding: 12px 18px;
            cursor: pointer;
            font-family: var(--font-game);
            text-align: left;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 70px;
            border-radius: 4px;
        }

        button.choice-btn:hover:not(:disabled) {
            background: #273549;
            border-color: var(--cold-blue);
            color: var(--pure-white);
            box-shadow: inset 4px 0 0 var(--cold-blue);
        }

        .stat-badges {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .badge {
            font-size: 8px;
            padding: 1px 5px;
            border-radius: 2px;
            font-weight: bold;
        }

        .b-sync { background: rgba(255, 255, 255, 0.1); color: var(--pure-white); border: 1px solid var(--pure-white); }
        .b-integ { background: rgba(0, 255, 210, 0.1); color: var(--electric-cyan); border: 1px solid var(--electric-cyan); }
        .b-noise { background: rgba(255, 42, 42, 0.1); color: var(--danger-red); border: 1px solid var(--danger-red); }

        /* 연출 효과 */
        .visual-danger { border-color: var(--danger-red); box-shadow: inset 0 0 30px rgba(255, 0, 0, 0.4); }
        .visual-purple { border-color: var(--purple-neon); box-shadow: inset 0 0 30px rgba(189, 0, 255, 0.3); }
        .visual-green { border-color: var(--green-neon); box-shadow: inset 0 0 30px rgba(57, 255, 20, 0.3); }
        .visual-glitch { animation: glitch 0.15s infinite; }
        @keyframes glitch { 
            0% { transform: translate(1px, 0); filter: hue-rotate(45deg); } 
            50% { transform: translate(-1px, 1px); filter: hue-rotate(90deg); } 
            100% { transform: translate(0, 0); filter: hue-rotate(0deg); }
        }
    </style>
</head>
<body>

    <div id="intro-screen">

        <div class="intro-visual-bg" id="matrix-bg"></div>

    <div class="top-hud">

    <div id="game-screen">

            <div class="dialog-box">
                <div class="speaker-tag" id="speaker-name">BOOT_LOG</div>
                <div id="dialog-text"></div>

        </div>

        <div class="choices-area" id="choices-area"></div>
    </div>

        const state = {

        const asciiPortraits = {

            sys: `   .-'''''-.\n  / _     _ \\\n | (o)   (o) |\n |     ▲     |\n  \\   ---   /\n   '-_..._-'`

        const scenes = {

                    { type: 'dialog', speaker: 'P-3', content: "W.O.L.F 보안망의 올가미가 턱밑까지 조여온다... 가상 고글에 찍힌 내 신경 데이터가 뜨겁게 끓는군.\n앞을 가로막은 보안 방벽실 너머, 첫째 형 P-1의 둔탁한 해머링 소리가 들린다. 어서 돌파해야만 해!" }

                    { label: "📡 지상 노출의 위험을 감수하고 상부 공용 안테나를 즉각적으로 강제 해킹한다", stats: {s:45, i:5, n:25}, next: 'hack_terminal' }
                ]
            },
            meet_p1: {
                location: 'SECTOR_01: RESISTANCE_WALL',

                ],

                    { type: 'narrative', content: "강철 먼지가 안개처럼 사방을 메운 대피실. P-1이 삐걱이는 외골격을 틀어쥐며 울부짖는다." },

                    { label: "⚡ 수동 전류 충전: 비상 전원 배터리 허브를 한계 돌파 개방하여 수동으로 급전한다", stats: {s:10, i:35, n:5}, next: 'p1_charge' }
                ]
            },
            p1_success: {
                location: 'SECTOR_01: SYNCED_BARRIER',
                speaker: 'P-1 (첫째 돼지)',
                portrait: 'p1',
                visualStyle: 'visual-green',
                visualTitle: '동기화 성공 - 홀로그램 장막',

        function updateStats(s, i, n) {
            state.sync = Math.min(100, Math.max(0, state.sync + s));
            state.integ = Math.min(100, Math.max(0, state.integ + i));
            state.noise = Math.min(100, Math.max(0, state.noise + n));

            document.getElementById('sync-val').innerText = state.sync;
            document.getElementById('integ-val').innerText = state.integ;
            document.getElementById('noise-val').innerText = state.noise;

            document.getElementById('sync-fill').style.width = state.sync + '%';
            document.getElementById('integ-fill').style.width = state.integ + '%';
            document.getElementById('noise-fill').style.width = state.noise + '%';
        }

        function updateKeyIndicator() {
            const ind = document.getElementById('token-indicator');
            const txt = document.getElementById('token-text');
            if (state.accessToken) {
                ind.classList.add('active');
                txt.innerText = 'ACQUIRED (VERIFIED)';
                txt.style.color = 'var(--electric-cyan)';
            } else {
                ind.classList.remove('active');
                txt.innerText = 'NOT ACQUIRED';
                txt.style.color = 'var(--text-gray)';
            }
        }

        function calculateFinalEnding() {
            if (state.sync >= 65 && state.noise < 50) {
                renderScene('ending_revolution');
            } else if (state.integ >= 50) {
                renderScene('ending_humanist');
            } else {
                renderScene('ending_format');
            }
        }

        async function renderScene(sceneKey) {
            state.currentScene = sceneKey;
            const scene = scenes[sceneKey];
            
            document.getElementById('location-name').innerText = scene.location;
            document.getElementById('speaker-name').innerText = scene.speaker;
            
            document.getElementById('visual-title').innerText = scene.visualTitle || `NODE: ACTIVE`;
            document.getElementById('visual-desc').innerText = scene.visualDesc || `실시간 패킷 스트림 분석 중...`;
            
            const portraitArt = asciiPortraits[scene.portrait] || asciiPortraits.sys;
            document.getElementById('portrait-art').innerText = portraitArt;
            document.getElementById('portrait-name').innerText = scene.speaker.split(' ')[0];

            const visualArea = document.getElementById('visual-area');
            visualArea.className = 'visual-area ' + (scene.visualStyle || '');

            // 🚨 이전 장면에 띄워져 있던 비디오 태그가 있다면 초기화 후 삭제 처리
            const oldVideo = visualArea.querySelector('.scene-video-bg');
            if (oldVideo) {
                oldVideo.remove();
            }

            // 🚨 새로 띄우려는 장면에 비디오 데이터(`videoSrc`)가 매핑되어 있을 경우 동적 생성 및 추가
            if (scene.videoSrc && scene.videoSrc.length > 0) {
                const videoEl = document.createElement('video');
                videoEl.className = 'scene-video-bg';
                videoEl.autoplay = true;
                videoEl.muted = true;
                videoEl.loop = true;
                videoEl.setAttribute('playsinline', '');

                scene.videoSrc.forEach(src => {
                    const sourceEl = document.createElement('source');
                    sourceEl.src = src;
                    sourceEl.type = 'video/mp4';
                    videoEl.appendChild(sourceEl);
                });

                visualArea.appendChild(videoEl);
                videoEl.play().catch(err => console.log("장면 비디오 재생 대기: ", err));
            }

            const dialogText = document.getElementById('dialog-text');
            const choicesEl = document.getElementById('choices-area');
            
            dialogText.innerHTML = '';
            choicesEl.innerHTML = ''; 

            scene.choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                
                let badgeHtml = '';
                if(c.stats) {
                    const sVal = c.stats.s;
                    const sSign = sVal >= 0 ? '+' : '';
                    badgeHtml += `<span class="badge b-sync">S ${sSign}${sVal}</span>`;

                    const iVal = c.stats.i;
                    const iSign = iVal >= 0 ? '+' : '';
                    badgeHtml += `<span class="badge b-integ">I ${iSign}${iVal}</span>`;

                    const nVal = c.stats.n;
                    const nSign = nVal >= 0 ? '+' : '';
                    badgeHtml += `<span class="badge b-noise">N ${nSign}${nVal}</span>`;
                }

                btn.innerHTML = `
                    <div class="choice-text">${c.label}</div>
                    <div class="stat-badges">${badgeHtml}</div>
                `;

                btn.onclick = () => {
                    state.isTyping = false;
                    if (c.stats) {
                        updateStats(c.stats.s, c.stats.i, c.stats.n);
                    }
                    
                    if (c.action) {
                        c.action();
                    } else if (c.next) {
                        renderScene(c.next);
                    }
                };
                choicesEl.appendChild(btn);
            });

            state.isTyping = true;
            for (const item of scene.text) {
                if (state.currentScene !== sceneKey) break;
                const prefix = item.type === 'dialog' ? `[${item.speaker}]: ` : '';
                const fullText = prefix + item.content + "\n\n";
                for (let i = 0; i < fullText.length; i++) {
                    if (state.currentScene !== sceneKey) break;
                    dialogText.innerText += fullText[i];
                    document.querySelector('.dialog-box').scrollTop = document.querySelector('.dialog-box').scrollHeight;
                    await new Promise(res => setTimeout(res, 8));
                }
            }
            state.isTyping = false;
        }

        function makeMatrixBackground() {
            const bg = document.getElementById('matrix-bg');
            let txt = '';
            for(let i=0; i<30; i++) {
                let row = '';
                for(let j=0; j<80; j++) {
                    row += Math.random() > 0.5 ? '1' : '0';
                }
                txt += row + '\n';
            }
            bg.innerText = txt;
        }

        function startGame() {
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                updateStats(0, 0, 0); 
                renderScene('start');
            }, 800);
        }

        // 🚨 브라우저의 강제 차단 정책을 무력화하기 위한 자바스크립트 트리거
        window.onload = () => {
            makeMatrixBackground();
            
            const video = document.getElementById('bg-video');
            if (video) {
                // 브라우저가 차단하더라도 강제로 재생하도록 보장하는 코드
                video.muted = true;
                video.play().catch(error => {
                    console.log("자동재생 일시 대기: ", error);
                    // 사용자가 첫 화면 어디든 한 번 클릭하면 바로 재생을 시작시킵니다.
                    document.addEventListener('click', () => {
                        video.play();
                    }, { once: true });
                });
            }
        };
    </script>
